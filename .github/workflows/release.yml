name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        working-directory: android
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "WORDFLOW_BACKEND_URL=${{ vars.WORDFLOW_BACKEND_URL || 'https://wordflow-production-916f.up.railway.app' }}" >> local.properties
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> local.properties
          echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> local.properties
          echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> local.properties
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> local.properties
          echo "WORDFLOW_SIGNING_STORE_FILE=app/wordflow-release.jks" >> local.properties
          echo "WORDFLOW_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "WORDFLOW_SIGNING_KEY_ALIAS=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> local.properties
          echo "WORDFLOW_SIGNING_KEY_PASSWORD=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> local.properties

      - name: Decode signing keystore
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "ANDROID_SIGNING_KEYSTORE_BASE64 is required for release signing" >&2
            exit 1
          fi
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 -d > app/wordflow-release.jks

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "WordFlow v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
